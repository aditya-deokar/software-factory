<text x="584" y="484" font-size="17" font-weight="600" fill="#f3eee3">Route</text>
<text x="788" y="484" text-anchor="end" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">model-routing</text>
<text x="584" y="512" font-size="13" fill="#8a8374">cheapest tier that does it well</text>
