<rect x="485.0" y="329" width="430" height="26" rx="13" fill="#0f0e0c"/>
<text x="700.0" y="347" text-anchor="middle" font-size="14.5" fill="#f3eee3">regressions and higher rungs become new issues</text>
<line x1="700.0" y1="356" x2="700.0" y2="396" stroke="#8a8374" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="714.0" y="382" font-size="13" fill="#8a8374">every run writes .factory/</text>
