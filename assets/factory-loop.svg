<text x="554" y="204" font-size="23" font-weight="600" fill="#f3eee3">Isolate</text>
<text x="554" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">worktree-isolation</text>
<text x="554" y="258" font-size="13" fill="#8a8374">own worktree, off</text>
<text x="554" y="277" font-size="13" fill="#8a8374">origin/main</text>
