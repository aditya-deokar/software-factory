     then screenshot at 1400x586 with device scale factor 2 and a transparent background
     (chrome headless: force-device-scale-factor=2, default-background-color=00000000). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="586" viewBox="0 0 1400 586" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
