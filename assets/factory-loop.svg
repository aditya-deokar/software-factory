<text x="480" y="169.5" text-anchor="middle" font-size="11.5" fill="#8a8374">human</text>
<text x="388" y="204" font-size="23" font-weight="600" fill="#f3eee3">Spec</text>
<text x="388" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">spec-writing</text>
<text x="388" y="258" font-size="13" fill="#8a8374">product + tech spec,</text>
<text x="388" y="277" font-size="13" fill="#8a8374">when it is needed</text>
