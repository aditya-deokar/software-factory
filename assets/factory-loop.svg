<text x="886" y="204" font-size="23" font-weight="600" fill="#f3eee3">Prove</text>
<text x="886" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">test-evidence</text>
<text x="886" y="258" font-size="13" fill="#8a8374">before and after,</text>
<text x="886" y="277" font-size="13" fill="#8a8374">against the judge</text>
<line x1="1022" y1="220.0" x2="1033" y2="220.0" stroke="#8a8374" stroke-width="1.6" marker-end="url(#ah)"/>
