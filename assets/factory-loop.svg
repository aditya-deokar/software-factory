<text x="720" y="204" font-size="23" font-weight="600" fill="#f3eee3">Build</text>
<text x="720" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">service-layer</text>
<text x="720" y="258" font-size="13" fill="#8a8374">boundaries decide,</text>
<text x="720" y="277" font-size="13" fill="#8a8374">services do</text>
<line x1="856" y1="220.0" x2="867" y2="220.0" stroke="#8a8374" stroke-width="1.6" marker-end="url(#ah)"/>
