<text x="836" y="484" font-size="17" font-weight="600" fill="#f3eee3">Improve</text>
<text x="1040" y="484" text-anchor="end" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">skill-feedback-loop</text>
<text x="836" y="512" font-size="13" fill="#8a8374">repeated corrections, counted</text>
