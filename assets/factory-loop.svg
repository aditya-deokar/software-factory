<rect x="1116" y="154" width="56" height="22" rx="11" fill="none" stroke="#8a8374" stroke-width="1"/>
<text x="1144" y="169.5" text-anchor="middle" font-size="11.5" fill="#8a8374">human</text>
<text x="1052" y="204" font-size="23" font-weight="600" fill="#f3eee3">Ship</text>
<text x="1052" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">code-review-loop</text>
<text x="1052" y="258" font-size="13" fill="#8a8374">PR with proof,</text>
<text x="1052" y="277" font-size="13" fill="#8a8374">reviewed to 5/5</text>
<line x1="1188" y1="220.0" x2="1199" y2="220.0" stroke="#8a8374" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="1202" y="140" width="150" height="160" rx="14" fill="#191714" stroke="#2e2a25" stroke-width="1.2"/>
<text x="1218" y="170" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b">7</text>
<text x="1218" y="204" font-size="23" font-weight="600" fill="#f3eee3">Monitor</text>
<text x="1218" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">release-monitoring</text>
<text x="1218" y="258" font-size="13" fill="#8a8374">merge checked,</text>
<text x="1218" y="277" font-size="13" fill="#8a8374">regressions to issues</text>
