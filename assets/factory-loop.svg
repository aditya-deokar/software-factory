<text x="56" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">issue-triage</text>
<text x="56" y="258" font-size="13" fill="#8a8374">one decision</text>
<text x="56" y="277" font-size="13" fill="#8a8374">per issue</text>
