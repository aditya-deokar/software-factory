<text x="80" y="512" font-size="13" fill="#8a8374">beats, evidence, corrections</text>
<rect x="316" y="456" width="236" height="76" rx="12" fill="#0f0e0c" stroke="#2e2a25"/>
<text x="332" y="484" font-size="17" font-weight="600" fill="#f3eee3">Remember</text>
<text x="536" y="484" text-anchor="end" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">agent-memory</text>
