<text x="222" y="204" font-size="23" font-weight="600" fill="#f3eee3">Aim</text>
<text x="222" y="228" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" fill="#f5610b" opacity="0.85">ambition-engine</text>
<text x="222" y="258" font-size="13" fill="#8a8374">goal beyond the goal,</text>
<text x="222" y="277" font-size="13" fill="#8a8374">rung, outside judge</text>
